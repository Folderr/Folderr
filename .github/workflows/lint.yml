name: Lint
on:
    pull_request:
    push:
        branches: [dev]

permissions:
    contents: read

jobs:
    biome:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 22
                  cache: npm

            - name: Install Dependencies
              run: npm ci

            # Uses the locally installed Biome so CI matches local runs
            - name: Biome
              run: npx biome ci .

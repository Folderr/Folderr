# Where Folderr keeps its data. Copy this file to configs/db.yaml.
# Can come from the FOLDERR_DB_URL environment variable instead.
#
# Use a database login with a password, and keep the database server off the public internet:
# bind it to 127.0.0.1 (or a private network) rather than 0.0.0.0.
url: "mongodb://folderr:change-me@127.0.0.1:27017/folderrDB?authSource=admin" # Required [FOLDERR_DB_URL]
